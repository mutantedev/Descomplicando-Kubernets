apiVersion: v1
kind: Pod
metadata:
  labels:
    run: girofull
    service: webservice
  name: girofull
spec:
  containers:

  - image: nginx
    name: webserver
    resources:
      limits:
        cpu: "0.3"
        memory: "128Mi"
      requests:
        cpu: "0.1"
        memory: "64Mi"


  - image: alpine
    name: alpine
    volumeMounts:
    - mountPath: /girologs
      name: girologs

    command:
      - /bin/sh
      - -c
    args:
      - |
        apk add --no-cache curl
        while true; do
          echo -e "\n\n===  Executando curl  ===" >> /girologs/logs.txt
          curl http://localhost:80 >> /girologs/logs.txt
          sleep 5
        done

    resources:
      limits:
        cpu: "0.6"
        memory: "246Mi"
      requests:
        cpu: "0.3"
        memory: "128Mi"


  dnsPolicy: ClusterFirst
  restartPolicy: Always
  volumes:
    - name: girologs
      emptyDir:
        sizeLimit: "64Mi"
status: {}
