apiVersion: v1
kind: Pod
metadata:
  labels:
    run: girodir
    service: webservice
  name: girodir
spec:
  containers:
  - image: nginx
    name: nginx
    volumeMounts:
    - mountPath: /girodir
      name: primeiro-emptydir
    resources:
      limits:
        cpu: "0.4"
        memory: "128Mi"
      requests:
        cpu: "0.2"
        memory: "64Mi"

  dnsPolicy: ClusterFirst
  restartPolicy: Always
  volumes:
  - name: primeiro-emptydir
    emptyDir:
      sizeLimit: 256Mi
status: {}
