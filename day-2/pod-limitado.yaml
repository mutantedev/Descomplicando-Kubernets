apiVersion: v1
kind: Pod
metadata:
  labels:
    run: giropops
    service: webservice
  name: giropops
spec:
  containers:
  - image: ubuntu
    name: ubuntu
    args:
      - sleep
      - "6000"
    resources:
      limits:
        cpu: "0.6"
        memory: "128Mi"
      requests:
        cpu: "0.3"
        memory: "64Mi"

  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
